<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIDIMap editor: mockup</title>
<style>
  /* Drift Studio's look (dark, warm text, one amber accent, monospace, square
     corners, outline buttons), with brighter secondary text for readability. */
  :root {
    --bg: #050505; --panel: #0c0c0c; --panel-2: #121212;
    --line: #232323; --line-2: #343434;
    --txt: #e6e1d4; --txt-2: #b8b2a4;
    --hot: #e8a84c; --live: #ff5a45; --run: #4ade80; --sv: #67e8f9;
    --mono: "SF Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); font: 12px/1.45 var(--mono); letter-spacing: .04em; text-transform: lowercase; }
  button, select, input { font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; }
  button { background: transparent; border: 1px solid var(--line-2); padding: 4px 9px; cursor: pointer; white-space: nowrap; }
  button:hover, button.on { border-color: var(--hot); color: var(--hot); }
  select, input[type=number], input[type=text] { background: var(--panel); border: 1px solid var(--line-2); padding: 3px 6px; }
  input[type=number] { width: 4.6em; text-align: right; }
  input[type=range] { accent-color: var(--hot); width: 100%; margin: 0; }
  kbd { font: 10px var(--mono); color: var(--txt-2); border: 1px solid var(--line-2); padding: 0 4px; margin-left: 4px; text-transform: none; }
  .dim { color: var(--txt-2); }

  /* mockup chooser (not part of the design) */
  #chooser { position: fixed; z-index: 20; bottom: 34px; right: 16px; background: rgba(26, 20, 5, .96); border: 1px solid var(--hot); padding: 6px 10px; box-shadow: 0 6px 30px #000; display: flex; gap: 6px; align-items: center; }
  #chooser b { color: var(--hot); font-weight: normal; }
  #chooser[hidden] { display: none; }

  .app { display: grid; height: 100vh; grid-template: "top top top" auto "lib main insp" 1fr "pads pads pads" auto "status status status" auto / 330px 1fr 370px; }

  /* top bar: project, tempo, record, live */
  .topbar { grid-area: top; display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 48px; border-bottom: 1px solid var(--line); background: var(--panel); position: relative; }
  .mark { font-size: 14px; letter-spacing: .3em; color: #f1ecdf; margin-right: 4px; }
  .mark i { font-style: normal; color: var(--hot); }
  .group { display: flex; align-items: center; gap: 5px; padding: 0 7px; white-space: nowrap; border-left: 1px solid var(--line); height: 100%; }
  .group .label { color: var(--txt-2); margin-right: 2px; }
  .saved { color: var(--run); }
  .spacer { flex: 1; }
  .beat { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--hot); box-shadow: 0 0 8px var(--hot); }
  .live { border-color: var(--live); color: var(--live); }
  .live.on { background: var(--live); color: #000; border-color: var(--live); }
  .live.on kbd { color: #000; border-color: #000; }
  .live.on::before { content: "● "; }
  .rec::before { content: "● "; color: var(--live); }

  /* project menu */
  .menu { position: absolute; top: 46px; left: 110px; z-index: 15; width: 470px; background: var(--panel-2); border: 1px solid var(--hot); box-shadow: 0 10px 40px #000; padding: 10px 12px; }
  .menu[hidden] { display: none; }
  .menu h3 { margin: 0 0 6px; font: 11px var(--mono); letter-spacing: .18em; color: var(--hot); font-weight: normal; }
  .menu ul { list-style: none; margin: 0 0 10px; padding: 0; }
  .menu li { display: flex; justify-content: space-between; padding: 4px 6px; border: 1px solid transparent; cursor: pointer; }
  .menu li:hover, .menu li.on { border-color: var(--line-2); }
  .menu li.on { color: var(--hot); }
  .menu .incl { columns: 2; margin: 0 0 10px; padding-left: 16px; color: var(--txt-2); }
  .menu .incl li { display: list-item; padding: 1px 0; border: none; cursor: default; }

  .status { grid-area: status; display: flex; gap: 18px; align-items: center; padding: 0 12px; height: 26px; border-top: 1px solid var(--line); color: var(--txt-2); background: var(--panel); font-size: 11px; }
  .status .ok { color: var(--run); }

  .pane { background: var(--panel); min-width: 0; min-height: 0; overflow: auto; }
  .frame { border: 1px solid var(--line); padding: 9px 11px; margin: 0 0 10px; }
  .frame > h3 { margin: 0 0 8px; font: 11px var(--mono); letter-spacing: .18em; color: var(--hot); font-weight: normal; display: flex; justify-content: space-between; gap: 8px; }
  .frame > h3 span { color: var(--txt-2); letter-spacing: .04em; }
  .frame.later { border-style: dashed; }
  .frame.later > h3 { color: var(--txt-2); }
  .row { display: grid; grid-template-columns: 9em 1fr 3.4em; gap: 8px; align-items: center; margin: 3px 0; }
  .row .v { text-align: right; color: var(--txt-2); }
  .row .cc { color: var(--hot); font-size: 10px; }
  .row.na { opacity: .45; }
  .note { color: var(--txt-2); margin: 4px 0; }
  .buttons { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0; }
  button:disabled { opacity: .6; cursor: default; border-style: dashed; }
  button:disabled:hover { border-color: var(--line-2); color: inherit; }

  /* left: map (bigger) + layers & blend */
  .lib { grid-area: lib; display: flex; flex-direction: column; border-right: 1px solid var(--line); overflow: hidden; }
  .map { position: relative; background: #0b0d0c; overflow: hidden; flex: 1 1 50%; min-height: 240px; border-bottom: 1px solid var(--line); }
  .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map .tag { position: absolute; left: 8px; bottom: 6px; color: var(--txt-2); font-size: 10px; background: rgba(5,5,5,.7); padding: 1px 5px; }
  .map .zoom { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 3px; }
  .map .zoom button { background: rgba(5,5,5,.82); padding: 1px 7px; }
  .lib .inner { flex: 1 1 50%; overflow: auto; }

  /* middle: the monitor (exactly what goes out) + transport */
  .main { grid-area: main; display: grid; grid-template-rows: auto auto 1fr; min-height: 0; }
  .monitor { position: relative; background: #000; display: flex; align-items: flex-start; justify-content: center; min-height: 0; overflow: hidden; }
  .monitor .screen { position: relative; aspect-ratio: 16 / 9; width: 100%; background: url(preview.jpg) center / cover; }
  .monitor .badge { position: absolute; top: 8px; left: 8px; background: rgba(5,5,5,.82); border: 1px solid var(--live); color: var(--live); padding: 2px 8px; font-size: 11px; }
  .monitor .info { position: absolute; top: 8px; right: 8px; background: rgba(5,5,5,.82); border: 1px solid var(--line-2); padding: 2px 8px; font-size: 11px; color: var(--txt-2); }
  .monitor .hud { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; gap: 14px; background: rgba(5,5,5,.82); border: 1px solid var(--line-2); padding: 3px 8px; font-size: 11px; }
  .monitor .hud .buf { color: var(--run); }
  /* on/off switches */
  .sw { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; padding: 3px 0; }
  .sw i { width: 28px; height: 14px; border: 1px solid var(--line-2); position: relative; flex: none; }
  .sw i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 8px; height: 8px; background: var(--txt-2); }
  .sw.on i { border-color: var(--hot); }
  .sw.on i::after { left: 16px; background: var(--hot); }
  .sw.on { color: var(--hot); }
  .sws { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 4px 0; }
  .seg { display: inline-flex; }
  .seg button + button { border-left: none; }
  .segrow { display: grid; grid-template-columns: 9em 1fr; gap: 8px; align-items: center; margin: 4px 0; }

  /* under the monitor: the run strip, and later sequences */
  .below { border-top: 1px solid var(--line); background: var(--panel); min-height: 0; overflow: auto; }
  .below .tabs { position: static; }
  .strip { position: relative; height: 34px; border: 1px solid var(--line-2); margin: 8px 0 4px; background: #0a0a0a; }
  .strip .buf { position: absolute; top: 0; bottom: 0; background: rgba(74, 222, 128, .18); border-left: 1px solid var(--run); border-right: 1px solid var(--run); }
  .strip .loop { position: absolute; top: 0; bottom: 0; border-left: 2px solid var(--hot); border-right: 2px solid var(--hot); background: rgba(232, 168, 76, .08); }
  .strip .head { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--live); }
  .strip .tick { position: absolute; bottom: 0; width: 1px; height: 6px; background: var(--line-2); }
  .scale { display: flex; justify-content: space-between; color: var(--txt-2); font-size: 10px; }
  .facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 14px; margin-top: 8px; }
  .facts span { color: var(--txt-2); display: block; font-size: 10px; }
  .lane { display: grid; grid-template-columns: 6em 1fr; gap: 8px; align-items: center; margin: 4px 0; }
  .lane .track { height: 18px; border: 1px dashed var(--line-2); position: relative; }
  .lane .track b { position: absolute; top: 2px; bottom: 2px; background: rgba(232, 168, 76, .25); border-left: 2px solid var(--hot); font-weight: normal; font-size: 10px; padding-left: 4px; color: var(--txt); white-space: nowrap; overflow: hidden; }

  .transport .sep { width: 1px; height: 18px; background: var(--line-2); margin: 0 4px; }
  .transport { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 7px 10px; border-top: 1px solid var(--line); background: var(--panel); }

  /* right: inspector tabs */
  .insp { grid-area: insp; border-left: 1px solid var(--line); }
  .tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .tabs button { border: none; border-bottom: 2px solid transparent; padding: 9px 11px; }
  .tabs button.on { border-bottom-color: var(--hot); }
  .inner { padding: 10px 12px; }

  /* bottom: places as pads, collapsible */
  .pads { grid-area: pads; border-top: 1px solid var(--line); background: var(--panel); }
  .pads .head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; user-select: none; }
  .pads .head .tick { color: var(--hot); width: 1em; display: inline-block; transition: transform .15s; }
  .pads.closed .head .tick { transform: rotate(-90deg); }
  .pads .head .title { color: var(--hot); letter-spacing: .18em; }
  .pads .body { padding: 0 10px 9px; }
  .pads.closed .body { display: none; }
  .slots { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
  .slot { border: 1px solid var(--line-2); padding: 9px 8px; cursor: pointer; min-width: 0; }
  .slot b { color: var(--hot); font-weight: normal; margin-right: 5px; }
  .slot .n { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot .src { font-size: 10px; color: var(--txt-2); white-space: nowrap; }
  .slot .src.m::before { content: "■ "; color: var(--run); }
  .slot .src.g::before { content: "■ "; color: var(--sv); }
  .slot.on { border-color: var(--hot); color: var(--hot); }

  /* the output window itself */
  .O { display: block; background: #000; }
  .O .screen { position: absolute; inset: 0; background: url(preview.jpg) center / cover; }
  .O .exitnote { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(5,5,5,.82); border: 1px solid var(--line-2); padding: 4px 10px; color: var(--txt-2); }
</style>
</head>
<body>
<div id="root"></div>

<div id="chooser">
  <b>mockup</b>
  <button data-l="E">editor <kbd>1</kbd></button>
  <button data-l="O">output window <kbd>2</kbd></button>
  <button data-menu>project menu</button>
  <button data-midi>midi setup</button>
  <span class="dim">hide <kbd>H</kbd></span>
</div>

<script>
// A static mockup: nothing is wired up.
const $ = (s) => document.querySelector(s);

const topbar = () => `
<header class="topbar">
  <span class="mark">midimap<i>∴</i></span>
  <div class="group">
    <button id="project-btn" title="the whole setup">project: berlin set ▾</button>
    <button title="⌘S">save</button>
    <span class="saved">● saved</span>
  </div>
  <div class="group" title="tempo">
    <span class="beat"></span>
    <button>−</button><input type="number" value="120" aria-label="bpm"><button>+</button><span class="label">bpm</span>
    <button title="T">tap</button>
    <select aria-label="steps per beat" title=", ."><option>1 / beat</option><option>2 / beat</option><option>4 / beat</option><option>1 / 2 beats</option><option>1 / 4 beats</option></select>
    <span class="sw on" style="margin:0 4px" title="B"><i></i>lock</span>
    <select aria-label="clock" title="C"><option>internal clock</option><option>midi clock in</option></select>
  </div>
  <span class="spacer"></span>
  <div class="group">
    <button id="midi-btn" title="midi setup">midi <span class="saved">●</span> ▾</button>
  </div>
  <div class="group">
    <button class="rec">rec <kbd>V</kbd></button>
    <button class="live on" title="sends to the output window and syphon">live <kbd>L</kbd></button>
  </div>
  <div class="menu" id="menu" hidden>
    <h3>projects</h3>
    <ul>
      <li class="on"><span>berlin set</span><span class="dim">today 10:42 · synced</span></li>
      <li><span>badwater</span><span class="dim">2026-09-29 · synced</span></li>
      <li><span>tokyo night tests</span><span class="dim">2026-09-28 · this mac only</span></li>
    </ul>
    <div class="buttons"><button>new</button><button>save <kbd>⌘S</kbd></button><button>save as…</button><button>rename</button><button>export file</button><button>import file</button></div>
    <h3 style="margin-top:12px">a project keeps everything</h3>
    <ul class="incl">
      <li>places (all banks)</li><li>layers &amp; blend</li><li>looks &amp; effects</li><li>camera</li>
      <li>tempo &amp; clock</li><li>audio (kick, …)</li><li>output settings</li><li>which midi profile it uses</li>
    </ul>
    <p class="note">synced through cloudflare like presets today, so the mac, the app and other browsers share them. a file export is a backup you can carry to a gig.</p>
  </div>
  <div class="menu" id="midi" hidden style="left:auto;right:150px;width:520px">
    <h3>midi devices</h3>
    <ul>
      <li class="on"><span>● minilab 3</span><span class="dim">controls · profile "minilab 3"</span></li>
      <li><span>● iac driver bus 1</span><span class="dim">clock in (from live)</span></li>
    </ul>
    <h3>profile <span class="dim" style="letter-spacing:.04em">· mappings belong to the controller, shared by all projects</span></h3>
    <div class="buttons"><select><option>minilab 3</option><option>launch control xl</option><option>+ new profile</option></select><button class="on">learn mode <kbd>M</kbd></button><button>export</button><button>import</button></div>
    <p class="note">in learn mode, click any control in the editor, then move a knob, fader or pad.</p>
    <ul style="margin-top:6px">
      <li><span>knob 1 · cc 74</span><span class="dim">blend mix</span></li>
      <li><span>knob 2 · cc 71</span><span class="dim">layer b delay</span></li>
      <li><span>main knob · cc 114 ∞</span><span class="dim">turn</span></li>
      <li><span>pads 1–8 · program 0–7</span><span class="dim">places 1–8</span></li>
      <li><span>fader 1 · cc 82</span><span class="dim">field of view</span></li>
      <li><span>…</span><span class="dim">14 more</span></li>
    </ul>
  </div>
</header>`;

const status = () => `
<footer class="status">
  <span class="ok">● output: display 2 · 1920×1080 · fullscreen</span>
  <span class="ok">● syphon "midimap" 30 fps</span>
  <span>midi: minilab 3</span>
  <span>project sync: on</span>
  <span class="spacer"></span>
  <span>mapillary cc-by-sa · run 2026-04-11</span>
</footer>`;

const map = () => `
<div class="map">
  <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
    <g stroke="#1b1f1d" stroke-width="7" fill="none"><path d="M-10 160 L410 128"/><path d="M80 -10 L120 310"/><path d="M260 -10 L300 310"/><path d="M-10 50 L410 26"/><path d="M-10 250 L410 232"/></g>
    <g stroke="#262b28" stroke-width="2" fill="none"><path d="M-10 205 Q200 190 410 182"/><path d="M180 -10 L200 310"/><path d="M-10 95 L410 80"/><path d="M340 -10 L360 310"/></g>
    <g stroke="var(--run)" stroke-width="2.5" fill="none"><path d="M-10 161 L410 129"/><path d="M80 -10 L120 310" opacity=".7"/><path d="M-10 51 L230 37"/><path d="M260 -10 L300 310" opacity=".5"/></g>
    <path d="M200 135 l-6 14 h12 z" fill="var(--live)" transform="rotate(80 200 142)"/>
  </svg>
  <div class="zoom"><button>+</button><button>−</button></div>
  <span class="tag">green: 360° runs · click one to play it</span>
</div>`;

const sw = (label, on = false, k = '') => `<span class="sw ${on ? 'on' : ''}"><i></i>${label}${k ? ` <kbd>${k}</kbd>` : ''}</span>`;
const row = (label, v, val, cc = '', na = false) => `
<div class="row ${na ? 'na' : ''}"><span>${label} ${cc ? `<span class="cc">cc ${cc}</span>` : ''}</span><input type="range" min="0" max="1" step=".01" value="${v}"><span class="v">${val}</span></div>`;

// Left, under the map: the layers and how they're blended, together.
const layers = () => `
<div class="frame"><h3>layer a</h3>
  <div class="buttons"><button class="on">mapillary</button><button>street view</button></div>
  <p class="note">run from 2026-04-11, 2196 photos.</p>
</div>
<div class="frame"><h3>layer b</h3>
  <div class="buttons"><button class="on">same run, delayed</button><button>another run here</button><button>off</button></div>
  ${row('delay', .2, '8 fr', '71')}
</div>
<div class="frame"><h3>blend a + b <span>[ ]</span></h3>
  <div class="buttons"><button>crossfade</button><button class="on">screen</button><button>multiply</button><button>difference</button><button>add</button><button>lighten</button><button>darken</button><button>exclusion</button></div>
  ${row('mix', .5, '0.50', '74')}
  ${row('cut ↔ dissolve', 0, '0.00', '76')}
</div>`;

const monitor = () => `
<div class="monitor">
  <div class="screen">
    <span class="badge">● live · output</span>
    <span class="info">1920×1080 · what the audience sees</span>
    <div class="hud"><span>a 2026-04-11 · frame 1811/2196</span><span>b same run, 8 behind</span><span class="buf">buffered 30 ahead</span></div>
  </div>
</div>`;

const transport = () => `
<div class="transport">
  <button class="on">▶ play <kbd>space</kbd></button>
  <button>◀ ▶ step <kbd>← →</kbd></button>
  <span class="seg"><button class="on">forward</button><button>backward</button></span><kbd>R</kbd>
  <span class="sep"></span>
  <button>loop in <kbd>I</kbd></button><button>loop out <kbd>O</kbd></button><span class="sw on"><i></i>loop</span>
</div>`;

let belowTab = 'run';
const below = () => `
<div class="below">
  <div class="tabs">
    <button data-below="run" class="${belowTab === 'run' ? 'on' : ''}">this run</button>
    <button data-below="place" class="${belowTab === 'place' ? 'on' : ''}">this place</button>
    <button data-below="seq" class="${belowTab === 'seq' ? 'on' : ''}">sequence <span class="dim">· experiment first</span></button>
  </div>
  <div class="inner">${belowTab === 'run' ? `
    <div class="strip">
      ${Array.from({ length: 21 }, (_, i) => `<span class="tick" style="left:${i * 5}%"></span>`).join('')}
      <span class="loop" style="left:78%;width:9%"></span>
      <span class="buf" style="left:82.4%;width:1.4%"></span>
      <span class="head" style="left:82.4%"></span>
    </div>
    <div class="scale"><span>photo 1</span><span>loop 1712 → 1905 (193 photos ≈ 1.3 km)</span><span>2196</span></div>
    <div class="facts">
      <div><span>run</span>2026-04-11 · 2196 photos</div>
      <div><span>here</span>photo 1811 · 52.5178, 13.4350</div>
      <div><span>heading</span>82° east · 6.9 m between photos</div>
      <div><span>layer b candidates</span>9 other runs within 20 m</div>
    </div>
    <p class="note">click or drag the strip to jump; green = photos loaded ahead; amber = loop. a loop is the first small step towards recording sequences.</p>` : belowTab === 'place' ? `
    <div class="facts" style="grid-template-columns: 2fr 1fr 1fr">
      <div><span>name (click to edit)</span><input type="text" value="karl-marx-allee · 2026-04-11" style="width:100%"></div>
      <div><span>slot</span><select><option>5</option></select></div>
      <div><span>&nbsp;</span><button>store playing photo here</button></div>
    </div>
    <div class="facts">
      <div><span>source</span>mapillary · cc-by-sa</div>
      <div><span>captured</span>2026-04-11 · 360° camera</div>
      <div><span>photographer</span>mapillary user (credit shown)</div>
      <div><span>other dates here</span>2021-11-18 … 2026-05-10 (10 runs)</div>
    </div>
    <p class="note">editable details for the playing place: its name, which pad it's on, and the credit the licence asks for.</p>` : `
    <div class="lane"><span>place</span><div class="track"><b style="left:2%;width:30%">karl-marx-allee</b><b style="left:32%;width:22%">badwater</b><b style="left:54%;width:40%">shibuya</b></div></div>
    <div class="lane"><span>look</span><div class="track"><b style="left:2%;width:50%">clean</b><b style="left:52%;width:42%">sun trails</b></div></div>
    <div class="lane"><span>mix</span><div class="track"><b style="left:10%;width:70%">automation</b></div></div>
    <div class="buttons"><button class="rec">record a take</button><button disabled>overdub</button><button disabled>loop take</button></div>
    <p class="note">a placeholder: how sequences are recorded and edited is still open; each approach gets its own experiment first, then the winner lands here.</p>`}
  </div>
</div>`;

const sections = {
  effects: () => `
  <div class="frame"><h3>echo</h3>
    ${row('echo', 0, '0.00', '93')}
    <div class="segrow"><span>style</span><span class="seg"><button class="on">blend</button><button>trails</button></span></div>
    ${row('zoom', .5, '1.000')}${row('rotate', .5, '0.00°')}</div>
  <div class="frame"><h3>glow & memory</h3>${row('bloom', .2, '0.20', '18')}${row('recall', 0, '0.00', '19')}${row('recall depth', 1, '1.00')}</div>
  <div class="frame"><h3>colour <span>tint colour ■</span></h3>${row('brightness', .33, '1.00')}${row('contrast', .33, '1.00')}${row('saturation', .33, '1.00')}${row('hue', 0, '0°')}${row('tint', 0, '0.00', '16')}${row('invert', 0, '0.00')}</div>
  <div class="frame"><h3>texture</h3>${row('blur', 0, '0 px', '83')}${row('smear', 0, '0.00', '85')}${row('pixelate', 0, '0 px')}${row('posterize', 0, '0.00')}${row('grain', .1, '0.10', '17')}${row('instability', 0, '0.00')}</div>
  <div class="frame"><h3>looks <span>shift + 1–9</span></h3>
    <div class="buttons"><button class="on">clean</button><button>sun trails</button><button>spiral</button><button>memory</button><button>dream</button><button>broken</button><button>badwater</button><button>+ save look</button></div>
  </div>
  <p class="note">when street view is playing, echo, recall and blending grey out: google's pictures can't be read.</p>`,
  camera: () => `
  <div class="frame"><h3>view</h3>
    ${row('field of view', .55, '90°', '82')}
    ${row('look up', 0, '0°', '1')}
    <div class="buttons"><button>look up <kbd>↑</kbd></button><button>horizon <kbd>↓</kbd></button></div>
  </div>
  <div class="frame"><h3>follow</h3>
    <div class="sws">${sw('face the direction of travel', true)}${sw('hold the sun', false, 'S')}</div>
    <p class="note">main knob turns, pitch strip glances left/right; drag the picture to look around.</p>
  </div>
  <div class="frame"><h3>photos</h3>
    <div class="sws">${sw('sharper photos (2048 px, slow)')}</div>
  </div>`,
  audio: () => `
  <div class="frame"><h3>kick <span><kbd>K</kbd> off → 808 → 909</span></h3>
    <div class="segrow" style="grid-template-columns:auto 1fr"><span class="seg"><button>off</button><button class="on">808</button><button>909</button></span></div>
    ${row('volume', .5, '0.50')}${row('offset', .5, '0 ms')}
    <p class="note">one kick per beat, locked to the tempo; recorded with the picture.</p>
  </div>
  <div class="frame later"><h3>more audio <span>later</span></h3>
    <p class="note">room for audio tools added here or adopted from other projects, for example:</p>
    <div class="buttons"><button disabled>+ sampler</button><button disabled>+ synth (the walk plays itself)</button><button disabled>+ from drift: sound</button><button disabled>+ audio in (react to sound)</button></div>
  </div>
  <div class="frame"><h3>audio out</h3>
    <div class="buttons"><button class="on">mac speakers</button><button>other device…</button></div>
  </div>`,
  output: () => `
  <div class="frame"><h3>output window</h3>
    <div class="buttons"><button class="live on">live <kbd>L</kbd></button><button class="on">display 2 · fullscreen</button><button>window</button></div>
    <p class="note">the picture only; follows the editor live. nothing you open or scroll here reaches it.</p>
  </div>
  <div class="frame"><h3>syphon <span>app only</span></h3>
    <div class="sws">${sw('send to syphon "midimap"', true)}</div>
    <div class="segrow"><span>frame rate</span><span class="seg"><button class="on">30 fps</button><button>60 fps</button></span></div>
  </div>
  <div class="frame"><h3>record <span><kbd>V</kbd></span></h3>
    <p class="note">records the output (picture + audio) to downloads as mp4.</p>
    <div class="buttons"><button class="rec">record</button></div>
  </div>
`,
};
const TABS = ['effects', 'camera', 'audio', 'output'];
let tab = new URLSearchParams(location.search).get('tab') || 'effects';
let padsOpen = true;

const SLOTS = [
  ['times square', 'm'], ['shibuya crossing', 'm'], ['piazza san marco', 'm'], ['badwater road', 'm'],
  ['karl-marx-allee', 'm', true], ['champs-élysées', 'g'], ['damrak', 'm'], ['esplanadi', 'g'],
];
const pads = () => `
<div class="pads ${padsOpen ? '' : 'closed'}">
  <div class="head" id="pads-head"><span class="tick">▾</span><span class="title">places</span><span>5 karl-marx-allee</span><span class="spacer"></span><span class="dim">1–8 or pads · option+1–8 stores the playing photo · <kbd>P</kbd> show/hide</span></div>
  <div class="body"><div class="slots">${SLOTS.map(([n, s, on], i) => `
    <div class="slot ${on ? 'on' : ''}"><span class="n"><b>${i + 1}</b>${n}</span><span class="src ${s}">${s === 'm' ? 'mapillary' : 'street view'}</span></div>`).join('')}
  </div></div>
</div>`;

const editor = () => `<div class="app">${topbar()}
  <aside class="lib pane">${map()}<div class="inner">${layers()}</div></aside>
  <main class="main">${monitor()}${transport()}${below()}</main>
  <aside class="insp pane">
    <div class="tabs">${TABS.map((t) => `<button data-tab="${t}" class="${t === tab ? 'on' : ''}">${t}</button>`).join('')}</div>
    <div class="inner">${sections[tab]()}</div>
  </aside>
  ${pads()}
  ${status()}</div>`;

const output = () => `<div class="app O"><div class="screen"></div><span class="exitnote">output window · esc leaves fullscreen (this note fades after 2 s)</span></div>`;

let current = (location.hash.slice(1) || 'E').toUpperCase();
let menuOpen = false;
let midiOpen = new URLSearchParams(location.search).has('midi');
if (new URLSearchParams(location.search).get('below')) belowTab = new URLSearchParams(location.search).get('below');
function render() {
  $('#root').innerHTML = current === 'O' ? output() : editor();
  if ($('#menu')) $('#menu').hidden = !menuOpen;
  for (const b of document.querySelectorAll('#chooser [data-l]')) b.classList.toggle('on', b.dataset.l === current);
  $('#chooser [data-menu]').classList.toggle('on', menuOpen);
  for (const b of document.querySelectorAll('[data-tab]')) b.addEventListener('click', () => { tab = b.dataset.tab; render(); });
  $('#pads-head')?.addEventListener('click', () => { padsOpen = !padsOpen; render(); });
  $('#project-btn')?.addEventListener('click', () => { menuOpen = !menuOpen; midiOpen = false; render(); });
  $('#midi-btn')?.addEventListener('click', () => { midiOpen = !midiOpen; menuOpen = false; render(); });
  if ($('#midi')) $('#midi').hidden = !midiOpen;
  for (const b of document.querySelectorAll('[data-below]')) b.addEventListener('click', () => { belowTab = b.dataset.below; render(); });
  for (const t of document.querySelectorAll('.sw')) t.addEventListener('click', () => t.classList.toggle('on'));
}
for (const b of document.querySelectorAll('#chooser [data-l]')) b.addEventListener('click', () => { current = b.dataset.l; render(); });
$('#chooser [data-menu]').addEventListener('click', () => { current = 'E'; menuOpen = !menuOpen; midiOpen = false; render(); });
$('#chooser [data-midi]').addEventListener('click', () => { current = 'E'; midiOpen = !midiOpen; menuOpen = false; render(); });
addEventListener('keydown', (e) => {
  if (e.target.closest('input, select')) return;
  if (e.code === 'KeyH') $('#chooser').hidden = !$('#chooser').hidden;
  else if (e.code === 'KeyP') { padsOpen = !padsOpen; render(); }
  else if (e.code === 'Digit1') { current = 'E'; render(); }
  else if (e.code === 'Digit2') { current = 'O'; render(); }
  else if (e.code === 'Escape') { menuOpen = false; midiOpen = false; render(); }
});
addEventListener('hashchange', () => { current = location.hash.slice(1).toUpperCase(); render(); });
render();
</script>
</body>
</html>
